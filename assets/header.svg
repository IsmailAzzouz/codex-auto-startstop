<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="codex-auto-startstop: wrap up before Codex's usage limit, resume automatically after the reset">
  <rect width="1280" height="320" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1280" height="4" fill="#ffffff"/>

  <!-- stop / start glyph -->
  <g fill="#ffffff">
    <rect x="72" y="84" width="11" height="60" rx="2"/>
    <rect x="92" y="84" width="11" height="60" rx="2"/>
  </g>
  <path d="M128 84 L172 114 L128 144 Z" fill="#ffffff"/>

  <!-- title -->
  <text x="204" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#ffffff">codex-auto-startstop</text>

  <!-- subtitle -->
  <text x="208" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#a3a3a3">Wrap up before Codex's usage limit. Resume automatically after the reset.</text>

  <!-- limit-window timeline -->
  <line x1="208" y1="250" x2="1072" y2="250" stroke="#2e2e2e" stroke-width="2"/>
  <circle cx="208" cy="250" r="6.5" fill="#ffffff"/>
  <circle cx="520" cy="250" r="6.5" fill="#ffffff"/>
  <circle cx="840" cy="250" r="6.5" fill="#ffffff"/>
  <circle cx="1072" cy="250" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8f8f8f">
    <text x="208" y="278">window opens</text>
    <text x="520" y="278" text-anchor="middle">stop + HANDOFF.md</text>
    <text x="840" y="278" text-anchor="middle">limit resets</text>
    <text x="1072" y="278" text-anchor="end">auto-resume</text>
  </g>

  <!-- limits label -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6f6f6f">
    <text x="1072" y="86" text-anchor="end">5-hour &#183; weekly limits</text>
    <text x="1072" y="110" text-anchor="end">Codex Stop + SessionStart hooks</text>
  </g>
</svg>
