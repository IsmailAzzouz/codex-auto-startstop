name: CI and release

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default, including pull requests from forks.
permissions:
  contents: read

jobs:
  synthetic:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate release version metadata
        run: python scripts/release_version.py check
      - name: Test automatic release logic
        run: python tests/release_test.py
        if: runner.os != 'Windows'
      - name: Simulate release publication and reruns (offline Git/GitHub)
        run: python tests/release_integration_test.py
        if: runner.os != 'Windows'
      - name: Run synthetic hooks tests
        run: python tests/synthetic_test.py

  release:
    name: Publish GitHub release
    needs: synthetic
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This permission is used ONLY after all test matrix jobs succeed.
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh
